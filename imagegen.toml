# imagegen bridge configuration.
#
# The bridge reads this file from its working directory by default; set
# IMAGEGEN_CONFIG to use a different path. Every value here can be overridden by
# the matching environment variable (IMAGEGEN_DIFFUSION, IMAGEGEN_LLM, ...,
# IMAGEGEN_LORA_DIR, IMAGEGEN_LORA, IMAGEGEN_LORA_MULTIPLIER, IMAGEGEN_SIGMAS,
# IMAGEGEN_TURBO, IMAGEGEN_TURBO_CFG_SCALE), which is how a test points one value
# elsewhere without editing this file.
#
# Two sampling profiles live in the one process. BASE is the default: the base
# model, sd.cpp's own scheduler, `steps` and `cfg_scale`. TURBO is the Viggle
# few-step distillation: the adapter plus its published schedule. The mode is
# switched at runtime (POST /v1/turbo, or a per-request "turbo" flag), so the
# adapter is no longer applied to every generation.
#
# The STANDING deployment is base-only, on Q6_K with default VAE tiling: measured
# 2026-09-27 at 1024 square (same prompt and seed, independent critic pass), Q6_K
# scores 9/10 realism against 6/10 for Q4_K_M with the 16x16 tiles and 3/10 for
# turbo, at 183 s against 141 s and 29 s. The turbo keys at the bottom of this
# file are therefore commented out and the bridge reports turbo unavailable; the
# note above `diffusion` says exactly what to change to bring turbo back (it
# needs the Q4_K_M model plus the small VAE tiles, and a restart).
#
# Model paths have no built-in default on purpose: a wrong path that silently
# loads a different model is worse than a refusal to start.
#
# Layout follows the upstream model card, one directory per component:
#   models/diffusion_models/   the GGUF diffusion models
#   models/text_encoders/      the text encoders
#   models/vae/                the VAE

# sd-server binary, and the model paths it is given.
sd_server = "bin/sd-server"
# Q6_K: the standing deployment is the base model, chosen for stills quality.
# Measured 2026-09-27 at 1024 square, one prompt and seed, critic pass (agy):
#   Q6_K, default tiling:     183 s, peak VRAM 9200 MiB, realism 9/10
#   Q4_K_M, 16x16 VAE tiles:  141 s, peak VRAM 7272 MiB, realism 6/10
#   turbo (Q4_K_M + adapter):  29 s, peak VRAM 7978 MiB, realism 3/10
#
# The turbo adapter cannot run on Q6_K at 1024 square (measured: "model manager
# cannot make enough memory available on CUDA0", then segment 29/34
# transformer_blocks.27 fails during weight preparation), so the adapter keys at
# the bottom of this file are commented out and the bridge reports turbo
# unavailable. To use turbo again, change all three together:
#   1. diffusion to models/diffusion_models/qwen-image-2.1-Q4_K_M.gguf
#   2. backend_args to add --vae-tiling --vae-tile-size 16x16
#   3. uncomment lora_dir, lora, lora_multiplier and sigmas below
# then restart the bridge (about 35 s of weight staging) and toggle as
# documented in docs/viggle-turbo-lora.md.
diffusion = "models/diffusion_models/qwen-image-2.1-Q6_K.gguf"
vae       = "models/vae/qwen_image_2.1_vae_bf16.safetensors"

# The text encoder. The upstream card recommends the ComfyUI int8 convrot file
# (8.71 GiB) over the bf16 one (16.33 GiB), and that ordering is true within that
# pair. Against the GGUF encoder below it is not a memory saving: it reports
# 10,104.77 MB of parameters against 4,302.33 MB, for the same VRAM peak, a
# somewhat higher conditioning time, and a tie on image quality.
#
# It also needs the patched build from patches/0001 and patches/0002. The patch
# that dequantizes the int8 token embedding reads the companion row scales from
# whichever source the weights came from: a plain file (sd-cli) or an mmap
# (sd-server). Handling only the plain-file case made a generation abort the
# backend with "type i8 unsupported for integer quantization" while sd-cli worked;
# both paths are implemented as of 2026-09-22. The zip path is still unimplemented
# and logs an explicit error rather than throwing.
llm = "models/text_encoders/qwen3vl_8b_int8_convrot.safetensors"

# Fallback that needs no patched sd.cpp, at 4.3 GB instead of 10.1 GB of params:
# llm = "models/text_encoders/Qwen3VL-8B-Instruct-Q4_K_M.gguf"

# Where each module's graphs run and where its parameters live. Measured on this
# workstation: diffusion parameters pinned in VRAM, text encoder entirely on the
# CPU, VAE parameters in RAM with GPU compute. This holds ~4.4 GiB less host RAM
# and ~3.4 GiB less of the VRAM peak than sd.cpp's --offload-to-cpu. Pinning the
# text encoder's parameters as well cannot complete a 1024-square generation on
# this 12 GB card. See docs/architecture.md.
#
# Default VAE tiling (no --vae-tiling): with Q6_K and no adapter the 1024-square
# decode fits, and the small tiles were only ever needed for the turbo adapter's
# 2.4 GB of runtime tables. The turbo deployment needs
# --vae-tiling --vae-tile-size 16x16 instead; see the note above `diffusion`.
backend_args = [
  "--backend", "te=cpu,diffusion=cuda0,vae=cuda0",
  "--params-backend", "te=cpu,diffusion=cuda0,vae=cpu",
]

# Where the bridge listens, and where its sd-server backend listens.
listen_ip    = "127.0.0.1"
listen_port  = 8787
backend_port = 8788

# Request defaults when the client does not send them.
#
# These are the BASE profile's values, and the bridge starts in base mode
# (turbo = false below), so a request that sends neither steps nor cfg_scale runs
# the 28-step base model at cfg 6.0. Turbo mode would take its step count from
# the sigma schedule and its cfg from turbo_cfg_scale instead, but turbo is
# disabled in this deployment (see the note above `diffusion`).
steps     = 28
cfg_scale = 6.0

# Mode the bridge starts in. false (the default) is the base model. Switch it at
# runtime, no restart needed:
#   curl -s -X POST http://127.0.0.1:8787/v1/turbo -d '{"enabled":true}'
#   curl -s -X POST http://127.0.0.1:8787/v1/turbo -d '{"enabled":false}'
#   curl -s http://127.0.0.1:8787/v1/turbo        # the live mode and its settings
# or for one request only with "turbo": true in the generation body. The mode is
# process state and is not persisted: a restart returns to this value. Enabling
# turbo is verified against the backend before it takes effect, and is refused
# (mode unchanged) when the adapter is not configured, not on disk, or not listed
# by the backend.
turbo = false

# Turbo-mode CFG scale. The distillation samples without guidance; this is what a
# turbo request sends when the client does not send cfg_scale itself.
turbo_cfg_scale = 1.0

# Few-step turbo adapter: DISABLED in the standing deployment. The keys are kept
# for reference and to make the switch back a three-line edit (see the note above
# `diffusion`); uncomment all four together with the Q4_K_M model and the 16x16
# VAE tiles, or turbo stays unavailable (the bridge reports turbo_available false
# and refuses POST /v1/turbo with 409).
#
# With the keys active, the path is relative to lora_dir on purpose: sd-server
# builds its LoRA cache from a recursive scan of the directory handed to it as
# --lora-model-dir and rejects any path that is not an exact cache entry, so an
# absolute path would fail with "invalid lora path". The Viggle Qwen-Image-2.1
# turbo distillation is six transformer passes with no classifier-free guidance;
# recipe, checksums and measured numbers in docs/viggle-turbo-lora.md. The sigma
# list is the six nodes Viggle ships plus the trailing 0.0 that makes it six
# steps rather than five (sd.cpp derives steps = sigmas.len() - 1).
# lora_dir        = "models/loras"
# lora            = "Qwen-Image-2.1-viggle-turbo-v0.2.1-6step-lora-r128.safetensors"
# lora_multiplier = 1.0
# sigmas = [1.0, 0.9375, 0.875, 0.75, 0.5, 0.25, 0.0]
