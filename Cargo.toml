# Workspace root for the imagegen Rust deliverables.
# crates/bridge is a thin OpenAI image API server that supervises
# stable-diffusion.cpp's sd-server backend.
# crates/convrot-verify checks the int8 convrot text encoder's dequantization
# against the upstream BF16 weights (the experiment's verifier, ported to Rust).

[workspace]
resolver = "2"
members = ["crates/bridge", "crates/convrot-verify"]