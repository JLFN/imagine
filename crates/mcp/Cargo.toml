[package]
name = "imagegen-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing an OpenAI-compatible image API to agent sessions"
license = "MIT"
publish = false

[[bin]]
name = "imagegen-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
imagegen-client = { path = "../client" }
rmcp = { version = "3.1.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
