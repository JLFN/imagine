[package]
name = "imagegen-client"
version = "0.1.0"
edition = "2021"
description = "Shared OpenAI-compatible image API client used by imagegen-cli and imagegen-mcp"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
